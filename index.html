<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tally">
<meta name="theme-color" content="#F2F5F4">
<title>Tally</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============ tokens ============ */
:root{
  --bg:#F2F5F4; --surface:#FFFFFF; --sunk:#E6ECEA; --ink:#15201D; --ink2:#52605B; --ink3:#86918D; --line:#DCE3E0;
  --accent:#1D5E57; --accent-ink:#FFFFFF;
  --pro:#6F66C9; --carb:#D39528; --fat:#2F8F82; --over:#C4563A;
  --font:"Onest", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1514; --surface:#171F1D; --sunk:#212B29; --ink:#E6EDEA; --ink2:#A7B3AF; --ink3:#6F7B77; --line:#28322F;
    --accent:#7CC4B8; --accent-ink:#0F1514; --pro:#9C94F0; --carb:#E8B350; --fat:#4FBFAE; --over:#E9825F;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1514; --surface:#171F1D; --sunk:#212B29; --ink:#E6EDEA; --ink2:#A7B3AF; --ink3:#6F7B77; --line:#28322F;
  --accent:#7CC4B8; --accent-ink:#0F1514; --pro:#9C94F0; --carb:#E8B350; --fat:#4FBFAE; --over:#E9825F;
  color-scheme:dark;
}

/* ============ base ============ */
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%;height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:16px;line-height:1.45;
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;min-height:100%;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;text-align:inherit}
input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
[hidden]{display:none!important}
.app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 10px) 20px calc(150px + env(safe-area-inset-bottom,0px))}
h1.title{font-size:28px;font-weight:600;letter-spacing:-.02em}
h2.sec{font-size:17px;font-weight:600;margin-bottom:10px}
.page-head{display:flex;align-items:center;justify-content:space-between;margin:6px 0 14px}
.textbtn{color:var(--accent);font-weight:600;font-size:15px;padding:8px 2px}
.textbtn.danger{color:var(--over)}
.hint{font-size:13px;color:var(--ink3);margin:6px 0 12px}
.empty{color:var(--ink2);font-size:15px;padding:18px 0}
.iconbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--ink2);flex:none}
.iconbtn:active{background:var(--sunk)}
.iconbtn svg{width:22px;height:22px}
.iconbtn.sm{width:34px;height:34px}.iconbtn.sm svg{width:18px;height:18px}
svg{display:block}

/* ============ nav ============ */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);
  background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  border-top:1px solid var(--line);padding:4px 8px calc(4px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}
.nav-in{display:grid;grid-template-columns:repeat(5,1fr);width:100%;max-width:560px}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 5px;font-size:11px;font-weight:500;color:var(--ink3)}
.nav button[aria-current="page"]{color:var(--ink)}
.nav svg{width:23px;height:23px}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(70px + env(safe-area-inset-bottom,0px));z-index:19;
  height:50px;padding:0 24px 0 18px;border-radius:99px;background:var(--ink);color:var(--bg);font-weight:600;font-size:15.5px;
  display:flex;align-items:center;gap:8px;box-shadow:0 6px 24px -8px rgba(10,30,25,.45)}
.fab svg{width:20px;height:20px}

/* ============ today ============ */
.dayhead{display:flex;align-items:center;justify-content:space-between;margin:0 -10px 8px}
.daylabel{font-size:16px;font-weight:600;padding:8px 10px;border-radius:99px;display:flex;align-items:center;gap:7px;min-height:40px}
.daylabel svg{width:17px;height:17px;color:var(--accent);flex:none}
.daylabel .day-chevron{display:flex;align-items:center}
.daylabel .day-chevron svg{width:14px;height:14px;color:var(--ink3)}
.daylabel:active{background:var(--sunk)}
.dayright{display:flex}
/* ============ day calendar ============ */
.calendar-header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:2px 0 14px}
.calendar-title{font-size:22px;font-weight:600;letter-spacing:-.025em}
.calendar-controls{display:flex;gap:4px}
.calendar-weekdays,.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.calendar-weekdays{margin:12px 0 5px}
.calendar-weekdays span{text-align:center;color:var(--ink3);font-size:12px;font-weight:600;padding:4px 0}
.calendar-day{aspect-ratio:1/1;min-height:41px;max-height:62px;width:100%;border-radius:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:15px;font-weight:500;position:relative}
.calendar-day:not(.calendar-selected):active{background:var(--sunk)}
.calendar-day.calendar-outside{color:var(--ink3);opacity:.62}
.calendar-day.calendar-current:not(.calendar-selected){box-shadow:inset 0 0 0 1.5px var(--accent);color:var(--accent);font-weight:700}
.calendar-day.calendar-selected{background:var(--accent);color:var(--accent-ink);font-weight:700}
.calendar-dot{width:5px;height:5px;border-radius:50%;background:var(--accent)}
.calendar-selected .calendar-dot{background:var(--accent-ink)}
.calendar-blank{width:5px;height:5px}
.calendar-footer{border-top:1px solid var(--line);margin-top:18px;padding-top:16px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.calendar-legend{font-size:13px;color:var(--ink2);display:flex;align-items:center;gap:7px}
.calendar-legend .calendar-dot{flex:none}
.calendar-today{border:1px solid var(--line);border-radius:99px;padding:9px 16px;font-size:14px;color:var(--accent);font-weight:600;white-space:nowrap}
.calendar-today:active{background:var(--sunk)}
.hero{padding:10px 0 22px}
/* Tappable daily/weekly calorie summary */
.hero-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:1px 0 13px}
.hero-title{font-size:13px;font-weight:600;color:var(--ink2)}
.calorie-scope{display:flex;align-items:center;gap:2px;background:var(--sunk);padding:3px;border-radius:12px}
.calorie-scope button{min-width:62px;text-align:center;padding:7px 11px;border-radius:9px;font-size:13px;font-weight:600;color:var(--ink2);line-height:1.25}
.calorie-scope button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.07)}
.hero-period{font-size:13px;color:var(--ink3);margin:0 0 7px}
.hero-switch{display:block;width:100%;border-radius:13px;text-align:left;padding:3px 0 4px;touch-action:manipulation}
.hero-switch:active .hero-tap-hint{color:var(--accent)}
.hero-num{font-size:clamp(54px,17vw,80px);font-weight:600;letter-spacing:-.045em;line-height:.99;display:flex;align-items:baseline;flex-wrap:wrap;gap:0}
.hero-num.over{color:var(--over)}
.hero-unit{font-size:17px;color:var(--ink2);font-weight:500;letter-spacing:0;margin-left:10px;white-space:nowrap}
.hero-tap-hint{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink3);padding-top:7px;font-weight:500}
.hero-tap-hint svg{width:14px;height:14px;flex:none}
.hero-week-note{font-size:11.5px;line-height:1.45;color:var(--ink3);margin-top:8px}
.hero-macros-title{font-size:12px;font-weight:600;color:var(--ink3);margin:0 0 8px;padding-top:3px}
@media(max-width:365px){.hero-num{font-size:clamp(48px,15.5vw,58px)}.hero-unit{font-size:14px}.calorie-scope button{min-width:54px;padding:7px 9px}}
.fuel{position:relative;height:12px;border-radius:99px;background:var(--sunk);overflow:hidden;display:flex;margin:20px 0 10px}
.fuel span{height:100%;flex:none}
.fuel span+span{box-shadow:inset 2px 0 0 var(--bg)}
.fuel .tick{position:absolute;top:0;bottom:0;width:2px;background:var(--bg)}
.hero-meta{color:var(--ink2);font-size:14px;display:flex;justify-content:space-between}
.hero-meta b{color:var(--ink);font-weight:600}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;padding:4px 0 24px;border-bottom:1px solid var(--line)}
.m-label{font-size:13px;color:var(--ink2);display:flex;align-items:center;gap:6px}
.m-label::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
.m-val{font-size:22px;font-weight:600;margin-top:4px;letter-spacing:-.01em;white-space:nowrap}
.m-val small{font-size:13px;color:var(--ink3);font-weight:500;letter-spacing:0}
.bar{height:4px;border-radius:99px;background:var(--sunk);margin:8px 0 6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);border-radius:inherit}
.m-left{font-size:12.5px;color:var(--ink3)}
.m-left.over{color:var(--over)}
.meal{padding:18px 0 4px;border-bottom:1px solid var(--line)}
.meal-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.meal-name{font-size:17px;font-weight:600}
.meal-r{display:flex;align-items:center;gap:2px}
.meal-kcal{font-weight:600;font-size:15px}
.meal-mac{font-size:12.5px;color:var(--ink3);margin-top:-2px}
.meal-mac b{font-weight:600}
.entries{list-style:none;padding:0;margin:6px 0 0}
.entry{position:relative;overflow:hidden;border-radius:12px}
.entry-del{position:absolute;inset:0;background:var(--over);color:#fff;display:flex;align-items:center;justify-content:flex-end;padding-right:20px;font-weight:600;font-size:14px}
.entry-main{position:relative;background:var(--bg);display:flex;width:100%;align-items:center;gap:12px;padding:10px 0;touch-action:pan-y;transition:transform .22s ease}
.entry-main.dragging{transition:none}
.e-txt{min-width:0;flex:1;display:flex;flex-direction:column}
.e-name{font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.e-sub{font-size:13px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.e-kcal{font-size:15px;color:var(--ink2)}
.meal-add{color:var(--accent);font-weight:600;font-size:14.5px;padding:8px 0 14px;display:inline-flex;gap:6px;align-items:center}
.meal-add svg{width:17px;height:17px}
.copyhint{margin-top:18px;display:flex;gap:10px;flex-wrap:wrap}


/* ============ enhanced date navigation ============ */
.week-strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;margin:0 0 11px;padding:1px 0 12px;border-bottom:1px solid var(--line)}
.week-day{display:flex;min-width:0;min-height:62px;align-items:center;justify-content:center;flex-direction:column;gap:5px;border-radius:13px;font-size:15px;font-weight:600;color:var(--ink2)}
.week-day .week-name{font-size:11px;font-weight:500;color:var(--ink3)}
.week-day.week-selected{background:var(--accent);color:var(--accent-ink)}
.week-day.week-selected .week-name{color:var(--accent-ink);opacity:.85}
.week-day.week-current:not(.week-selected){box-shadow:inset 0 0 0 1.5px var(--accent)}
.week-day .week-dot{height:4px;width:4px;border-radius:50%;background:var(--accent)}
.week-day .week-dot.over{background:var(--over)}
.week-day.week-selected .week-dot{background:var(--accent-ink)}
.week-day .week-blank{height:4px;width:4px}
.calendar-header{margin-bottom:4px}
.calendar-controls{align-items:center}
.calendar-jump-toggle{font-size:13px;color:var(--accent);font-weight:600;padding:6px 7px;white-space:nowrap;border-radius:9px}
.calendar-jump-toggle:active{background:var(--sunk)}
.calendar-jump{background:var(--bg);border:1px solid var(--line);padding:12px;border-radius:14px;margin:13px 0}
.calendar-jump label{display:block;font-size:12px;font-weight:600;color:var(--ink2);margin-bottom:8px}
.calendar-jump-row{display:flex;gap:8px}
.calendar-jump-row .inp{min-width:0;flex:1;background:var(--surface);height:44px}
.calendar-jump-row .btn{font-size:14px;height:44px;padding:0 14px;white-space:nowrap}
.calendar-progress{width:23px;height:4px;border-radius:9px;background:var(--sunk);overflow:hidden;display:block}
.calendar-progress>span{height:100%;display:block;min-width:3px;border-radius:9px;background:var(--accent)}
.calendar-progress.over>span{background:var(--over)}
.calendar-selected .calendar-progress{background:rgba(255,255,255,.35)}
.calendar-selected .calendar-progress>span{background:var(--accent-ink)}
.calendar-blank{height:4px;width:23px}
.calendar-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding:14px 12px;border-radius:14px;background:var(--bg);margin-top:14px}
.calendar-stats .cstat{min-width:0;text-align:center}
.calendar-stats b{display:block;font-size:19px;line-height:1.25;font-weight:600;letter-spacing:-.02em}
.calendar-stats span{display:block;margin-top:4px;font-size:11.5px;color:var(--ink2);line-height:1.3}
.calendar-stats-note{color:var(--ink3);font-size:11px;line-height:1.4;margin:8px 2px 0}
.calendar-legend{flex-wrap:wrap;gap:8px 12px;font-size:12px}
.calendar-legend-item{display:flex;align-items:center;gap:5px;white-space:nowrap}
.calendar-legend .calendar-dot.over{background:var(--over)}
.calendar-footer{margin-top:14px;padding-top:13px}
@media(max-width:365px){.calendar-title{font-size:19px}.calendar-controls{gap:0}.calendar-day{min-height:37px}.calendar-footer{gap:7px}.calendar-today{padding:8px 10px;font-size:12px}.calendar-stats{padding:12px 6px}.week-day{min-height:56px}}

/* ============ full-app usability improvements ============ */
.quicktools{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:13px 0 9px}
.quicktool{min-width:0;min-height:58px;border:1px solid var(--line);border-radius:14px;display:flex;align-items:center;justify-content:center;gap:7px;background:var(--surface);font-weight:600;font-size:13px;color:var(--ink2);white-space:nowrap}
.quicktool svg{width:17px;height:17px;flex:none;color:var(--accent)}
.quicktool:active{background:var(--sunk)}
.return-today{font-size:13px;font-weight:600;color:var(--accent);padding:8px 2px;display:inline-flex;align-items:center;gap:5px}.return-today svg{width:16px;height:16px}
.insight-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:14px}
.insight-card h3{font-size:14px;font-weight:600;margin:0 0 5px}
.insight-card p{color:var(--ink2);font-size:13px;line-height:1.5}
.choice-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:12px 0}
.choice-row button{padding:7px 12px;border:1px solid var(--line);border-radius:999px;font-size:13px;color:var(--ink2);font-weight:600;background:transparent}
.choice-row button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.trend-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.trend-top .choice-row{margin-top:0}
.chart-wrap{padding:14px 0 5px}
.trend-axis{display:flex;justify-content:space-between;font-size:12px;color:var(--ink3)}
.trend-note{font-size:12px;color:var(--ink3);margin:8px 0 3px}
.trend-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0}
.trend-stats>div{background:var(--sunk);border-radius:13px;padding:12px 9px;min-width:0}
.trend-stats b{font-size:19px;font-weight:600;display:block}
.trend-stats span{display:block;color:var(--ink2);font-size:11px;line-height:1.35;margin-top:2px}
.weight-entry{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:8px;align-items:end;margin:12px 0}
.weight-entry label{display:block;min-width:0}
.weight-entry label span{display:block;color:var(--ink2);font-size:12px;margin:0 0 5px}
.weight-entry .inp{min-width:0;padding:0 9px;font-size:14px}
.weight-entry .btn{height:48px;padding:0 13px}
.library-top .searchbox{margin:2px 0 12px}
.library-top .searchbox input{padding-left:43px}
.lib-info{color:var(--ink3);font-size:12px;margin:10px 0 0}
.lib-filter{margin:6px 0 10px}
.lib-filter .chip{font-size:13px;padding:0 12px;height:34px}
.library-results .p-sec:first-child{padding-top:8px}
.data-overview{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:12px 0 14px}
.data-overview>div{border-radius:12px;padding:12px 8px;background:var(--sunk);text-align:center}
.data-overview b{font-size:19px;font-weight:600;display:block}
.data-overview span{font-size:11px;color:var(--ink2)}
@media(max-width:370px){.quicktools{gap:5px}.quicktool{font-size:11.5px;gap:4px}.quicktool svg{width:15px;height:15px}.weight-entry{gap:5px}.weight-entry .inp{font-size:12px;padding:0 5px}.weight-entry .btn{font-size:13px;padding:0 10px}.choice-row button{padding:7px 10px}}
/* ============ food ============ */
.ctx{font-size:14px;color:var(--over);margin:-6px 0 12px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 14px;border-radius:99px;border:1px solid var(--line);font-size:14px;color:var(--ink2);white-space:nowrap;background:transparent}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.searchbox{position:relative;margin:14px 0 6px}
.searchbox>svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:19px;height:19px;color:var(--ink3);pointer-events:none}
.searchbox input{width:100%;height:50px;border-radius:14px;border:1px solid transparent;background:var(--sunk);padding:0 14px 0 42px;font-size:16px;-webkit-appearance:none;appearance:none}
#q{padding-right:52px}
.scanbtn{position:absolute;right:5px;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:10px;display:grid;place-items:center;color:var(--ink2)}
.scanbtn svg{width:22px;height:22px}
.scanbtn:active{background:var(--line)}
.searchbox input:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.subtabs{display:flex;gap:18px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);margin:8px 0 4px}
.subtabs::-webkit-scrollbar{display:none}
.subtabs button{flex:none;padding:12px 0 10px;font-size:14.5px;color:var(--ink3);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.subtabs button[aria-selected="true"]{color:var(--ink);border-color:var(--ink)}
.list{list-style:none;padding:0}
.frow{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.frow-main{flex:1;min-width:0;display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:12px;row-gap:1px;padding:12px 0}
.f-name{font-size:15.5px;font-weight:500;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.f-kcal{font-weight:600;font-size:15px;text-align:right;white-space:nowrap}
.f-kcal small{font-weight:400;color:var(--ink3);font-size:12px;margin-left:2px}
.f-sub{font-size:13px;color:var(--ink3);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.f-mac{font-size:12.5px;color:var(--ink3);text-align:right;white-space:nowrap}
.f-mac b{font-weight:600}
.qadd{width:38px;height:38px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;flex:none;color:var(--accent)}
.qadd svg{width:18px;height:18px}
.qadd:active{background:var(--line)}
.sec-label{font-size:13px;color:var(--ink2);font-weight:500;margin:18px 0 4px}
.histchips{margin:10px 0 2px}
.histchips .chip{height:32px;font-size:13.5px}
.offbox{margin-top:10px}
.rowbtn{display:flex;align-items:center;gap:10px;width:100%;padding:14px 0;color:var(--accent);font-weight:600;font-size:15px;border-bottom:1px solid var(--line)}
.rowbtn svg{width:18px;height:18px;flex:none}
.status{font-size:14px;color:var(--ink2);padding:14px 0}
.barrow{display:flex;gap:10px;margin-top:10px}
.barrow .inp{flex:1}

/* ============ forms ============ */
.field{display:block;margin-bottom:12px}
.field>span{display:block;font-size:13px;color:var(--ink2);margin-bottom:6px}
.inp{width:100%;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:0 14px;font-size:16px;-webkit-appearance:none;appearance:none}
.inp:focus{outline:none;border-color:var(--accent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.grid4{display:grid;grid-template-columns:repeat(2,1fr);gap:0 10px}
.btn{height:50px;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:16px;padding:0 20px;display:inline-flex;align-items:center;justify-content:center}
.btn.block{width:100%}
.btn.ghost{background:var(--sunk);color:var(--ink)}
.btn.danger{background:transparent;color:var(--over);border:1px solid var(--line)}
.btn:disabled{opacity:.4}
.btn.slim{height:48px}
.stack{display:flex;flex-direction:column;gap:10px}


.smart-web-btn{width:100%;display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap;background:var(--sunk);border:1px solid var(--line);padding:12px;border-radius:13px;margin-top:10px;font-size:14px;font-weight:650;color:var(--ink)}
.smart-web-btn svg{height:18px;width:18px;color:var(--accent)}
.smart-web-btn span{width:100%;text-align:center;color:var(--ink3);font-weight:400;font-size:12px}
.smart-web-btn:disabled{opacity:.55}
.smart-sources{margin-top:12px;padding:12px;background:var(--sunk);border-radius:13px;font-size:13px;display:grid;gap:8px}
.smart-sources a{color:var(--accent);overflow-wrap:anywhere}
/* ============ selective copy v1.1 ============ */
.copy-picker-intro{margin:8px 0 14px;color:var(--ink2);font-size:13.5px;line-height:1.5}
.copy-picker-tools{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:12px 0 8px}
.copy-picker-tools .count{color:var(--ink2);font-size:13px;font-weight:600}
.copy-picker-tools .links{display:flex;align-items:center;gap:16px}
.copy-picker-tools button{color:var(--accent);font-size:13px;font-weight:600;padding:7px 0}
.copy-list{border:1px solid var(--line);border-radius:16px;overflow:hidden;max-height:36vh;max-height:36dvh;overflow-y:auto;overscroll-behavior:contain;background:var(--bg)}
.copy-meal-group{font-size:11px;font-weight:700;letter-spacing:.055em;text-transform:uppercase;color:var(--ink3);padding:10px 14px 4px}
.copy-choice{display:flex;align-items:center;gap:12px;min-height:65px;padding:11px 12px;cursor:pointer;border-bottom:1px solid var(--line)}
.copy-choice:last-child{border-bottom:0}
.copy-choice:has(input:checked){background:color-mix(in srgb,var(--accent) 7%, var(--bg))}
.copy-choice input{appearance:none;-webkit-appearance:none;border:1.5px solid var(--ink3);width:23px;height:23px;min-width:23px;border-radius:7px;background:var(--surface);position:relative;cursor:pointer}
.copy-choice input:checked{background:var(--accent);border-color:var(--accent)}
.copy-choice input:checked:after{content:'';position:absolute;left:7px;top:3px;width:6px;height:11px;border:solid var(--accent-ink);border-width:0 2px 2px 0;transform:rotate(45deg)}
.copy-choice input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.copy-choice .copy-desc{min-width:0;flex:1;display:flex;flex-direction:column;gap:2px}
.copy-choice .copy-name{font-size:14.5px;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.copy-choice .copy-sub{font-size:12px;color:var(--ink3);line-height:1.35}
.copy-choice .copy-cal{color:var(--ink2);font-size:13px;font-weight:600;white-space:nowrap}
.copy-destination{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:16px}
.copy-destination label{display:block;min-width:0}
.copy-destination label span{display:block;font-size:12.5px;color:var(--ink2);font-weight:600;margin-bottom:6px}
.copy-destination .inp{min-width:0;height:46px;padding:0 10px;font-size:14px;background:var(--bg)}
.copy-picker-footer{position:sticky;bottom:-20px;z-index:1;background:var(--surface);border-top:1px solid var(--line);margin:18px -20px -6px;padding:13px 20px calc(8px + env(safe-area-inset-bottom,0px))}
.copy-picker-footer .btn{width:100%}
.copy-picker-footer .copy-note{font-size:11.5px;color:var(--ink3);text-align:center;margin:9px 0 0;line-height:1.4}
@media(max-width:360px){.copy-destination{grid-template-columns:1fr}.copy-list{max-height:31dvh}.copy-choice{padding:10px}}


/* ============ selective copy v1.2 improvements ============ */
.copy-meal-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--sunk);border-bottom:1px solid var(--line);padding:9px 13px;color:var(--ink2);font-size:12px;font-weight:700;letter-spacing:.035em}
.copy-meal-bar small{font-size:11px;font-weight:500;color:var(--ink3);letter-spacing:0;margin-left:4px}
.copy-meal-bar button{font-size:12px;font-weight:700;letter-spacing:0;color:var(--accent);min-height:30px;padding:4px 0}
.copy-nutrition{min-height:40px;margin:10px 0 13px;padding:10px 12px;border-radius:12px;background:var(--sunk);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:5px 10px;font-size:12px;color:var(--ink2)}
.copy-nutrition b{font-size:15px;color:var(--ink)}
.copy-dest-heading{font-size:13px;font-weight:700;color:var(--ink);margin:12px 0 8px}
.copy-quick-dates{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:9px}
.copy-quick-dates button{min-height:34px;padding:6px 12px;border:1px solid var(--line);border-radius:99px;color:var(--ink2);font-size:12px;font-weight:600;background:var(--bg)}
.copy-quick-dates button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.copy-target-preview{font-size:12px;color:var(--ink2);margin:10px 0 3px;line-height:1.5}
.copy-search{margin:0 0 7px}.copy-search .inp{height:42px;font-size:14px}
.copy-filter-empty{font-size:13px;color:var(--ink2);padding:10px 0}
.copy-choice[hidden],.copy-meal-bar[hidden]{display:none!important}
.copy-list{max-height:31dvh}
@media(max-width:360px){.copy-list{max-height:27dvh}.copy-quick-dates button{padding:6px 10px}}

/* ============ sheet ============ */
#sheet{position:fixed;inset:0;z-index:50}
.scrim{position:absolute;inset:0;background:rgba(8,18,16,.38);opacity:0;transition:opacity .22s}
.sheet{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;max-height:92vh;max-height:92dvh;overflow:auto;overscroll-behavior:contain;
  background:var(--surface);border-radius:24px 24px 0 0;padding:10px 20px calc(20px + env(safe-area-inset-bottom,0px));
  transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
#sheet.open .scrim{opacity:1}
#sheet.open .sheet{transform:none}
.grab{width:36px;height:4px;border-radius:9px;background:var(--line);margin:0 auto 16px}
.s-title{font-size:21px;font-weight:600;letter-spacing:-.01em;line-height:1.25}
.s-sub{color:var(--ink3);font-size:14px;margin-top:2px}
.qty-wrap{margin:18px 0 6px}
.qty{font-size:28px!important;font-weight:600;height:60px!important;margin-bottom:10px}
.s-kcal{font-size:40px;font-weight:600;letter-spacing:-.03em;margin-top:16px}
.s-kcal small{font-size:15px;font-weight:500;color:var(--ink2);letter-spacing:0;margin-left:6px}
.s-macs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0 6px}
.s-macs div{border-top:3px solid var(--c);padding-top:8px}
.s-macs b{display:block;font-size:18px;font-weight:600}
.s-macs span{font-size:13px;color:var(--ink2)}
.s-extra{font-size:13px;color:var(--ink3);margin:6px 0 4px}
.s-label{font-size:13px;color:var(--ink2);margin:16px 0 8px}
.s-actions{display:flex;gap:10px;align-items:center;margin-top:20px}
.s-actions .btn{flex:1}
.fav{width:50px;height:50px;border-radius:14px;background:var(--sunk);color:var(--ink3)}
.fav[aria-pressed="true"]{color:var(--carb)}
.fav[aria-pressed="true"] svg{fill:currentColor}
.s-sec{display:flex;justify-content:space-between;margin-top:10px}
.menu{list-style:none;padding:0}
.menu button{width:100%;padding:15px 0;font-size:16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
.menu button.danger{color:var(--over)}

/* ============ progress & settings ============ */
.p-sec{padding:22px 0;border-bottom:1px solid var(--line)}
.p-sec:last-child{border-bottom:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0 4px}
.stat b{display:block;font-size:22px;font-weight:600;letter-spacing:-.01em}
.stat span{font-size:12.5px;color:var(--ink3)}
.tbl{width:100%;border-collapse:collapse;font-size:15px;margin-top:6px}
.tbl th{font-weight:500;font-size:12.5px;color:var(--ink3);text-align:right;padding:8px 0}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{padding:10px 0;border-top:1px solid var(--line);text-align:right}
.tbl td:first-child{color:var(--ink2)}
.spark{width:100%;height:auto;margin-top:12px;color:var(--ink3)}
.wlist{list-style:none;padding:0;margin-top:8px}
.wlist li{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:14.5px;color:var(--ink2)}
.unitsuffix{align-self:center;color:var(--ink3);font-size:15px}

/* ============ toast ============ */
#toast{position:fixed;left:50%;bottom:calc(132px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);opacity:0;pointer-events:none;
  background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 16px;font-size:14.5px;display:flex;gap:18px;align-items:center;z-index:60;
  transition:opacity .2s,transform .2s;max-width:calc(100% - 40px);white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{color:var(--bg);font-weight:700;text-decoration:underline;text-underline-offset:3px}

.ing{display:grid;grid-template-columns:78px minmax(0,1fr) auto auto;gap:6px 8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.ing-name{grid-column:1/-1;font-size:15px;font-weight:500;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ing .inp{height:40px;font-size:15px;padding:0 10px;border-radius:10px}
.ing-kcal{font-size:14px;color:var(--ink2);min-width:46px;text-align:right}
.ing-fixed{grid-column:1/3;font-size:13px;color:var(--ink3)}
.sec-row{display:flex;justify-content:space-between;align-items:baseline}
.ta{height:auto;min-height:96px;padding:12px 14px;line-height:1.4;resize:vertical;display:block}
.ai-raw{grid-column:1/-1;font-size:13px;color:var(--ink3);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ai-alt{grid-column:1/-1}
.aiimg{display:block;width:100%;max-height:240px;object-fit:cover;border-radius:14px;margin-top:12px}
.sizerow{display:flex;gap:8px}
.sizerow .inp:last-child{width:86px;flex:none}
.reader{border-radius:16px;overflow:hidden;background:#000;min-height:260px;margin-top:6px}
.reader video{width:100%!important;height:auto!important;display:block}
#toast span{overflow:hidden;text-overflow:ellipsis}
.btn svg{width:20px;height:20px}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
@media (min-width:700px){ .fab{bottom:88px} }
/* ============ multi-item logging ============ */
.batch-start{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--accent);border:1px solid var(--line);border-radius:999px;padding:9px 12px}
.batch-start svg{width:16px;height:16px}
.batch-banner{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:13px 14px;margin:4px 0 14px}
.batch-banner-title{display:flex;align-items:center;justify-content:space-between;gap:8px}
.batch-banner-title strong{font-size:15px}
.batch-banner p{margin-top:5px;color:var(--ink2);font-size:12.5px;line-height:1.5}
.batch-draft{font-size:13px;color:var(--accent);background:var(--sunk);padding:10px 12px;border-radius:12px;display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 0 2px;width:100%;font-weight:600}
.batch-draft svg{width:18px;height:18px}
.app.batch-active{padding-bottom:calc(225px + env(safe-area-inset-bottom,0px))}
.batch-tray{position:fixed;bottom:calc(67px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);z-index:18;max-width:560px;width:100%;padding:10px 18px 12px;background:var(--bg);border-top:1px solid var(--line);box-shadow:0 -9px 22px rgba(0,0,0,.035)}
.batch-tray-inner{display:flex;align-items:center;gap:12px;justify-content:space-between}
.batch-tray-summary{min-width:0}
.batch-tray-summary b{display:block;font-size:15px;font-weight:600}
.batch-tray-summary span{display:block;font-size:12px;color:var(--ink2);margin-top:2px}
.batch-tray .btn{height:43px;font-size:14px;white-space:nowrap;padding:0 15px}
.batch-item{padding:12px 0;border-bottom:1px solid var(--line)}
.batch-item-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.batch-item-top strong{font-size:15px;font-weight:600}
.batch-item-top span{font-size:13px;color:var(--ink2);white-space:nowrap}
.batch-item-ctrl{display:grid;grid-template-columns:90px minmax(0,1fr) auto;gap:8px;align-items:center;margin-top:10px}
.batch-item-ctrl .inp{height:41px;font-size:14px;padding:0 9px}
.batch-item-ctrl .iconbtn{width:38px;height:38px;color:var(--over)}
.batch-item-detail{font-size:12.5px;color:var(--ink3);margin-top:6px}
.batch-review-total{padding:13px 0;border-top:1px solid var(--line);margin-top:8px}
.batch-review-total b{font-size:23px;font-weight:600}
.batch-review-total p{color:var(--ink2);font-size:12.5px}
.batch-readonly-note{color:var(--ink3);font-size:12px;margin-top:8px}
.batch-ready-tip{color:var(--ink2);font-size:12px;margin-top:8px}
.scanner-options{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:10px 0}
.scanner-options .btn{height:45px;font-size:13px;padding:0 8px;gap:7px}
.scanner-options svg{width:18px;height:18px}
.scanner-status{font-size:13px;line-height:1.5;min-height:22px;padding:8px 0}
.reader{position:relative;min-height:245px}
.scanner-guide{font-size:12px;color:var(--ink3);margin:-2px 0 9px}
@media(max-width:350px){.batch-tray{padding:8px 12px 10px}.batch-tray .btn{padding:0 10px}.batch-item-ctrl{grid-template-columns:70px minmax(0,1fr) auto}.scanner-options .btn{font-size:12px}}
</style>

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const pad = n => String(n).padStart(2, '0');
const dateKey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const todayKey = () => dateKey(new Date());
const addDays = (k, n) => { const d = parseKey(k); d.setDate(d.getDate() + n); return dateKey(d); };
const fmtN = (n, dp = 0) => (Number.isFinite(n) ? n : 0).toLocaleString('en-CA', { maximumFractionDigits: dp });

  const t = todayKey();
  if (k === t) return 'Today';
  if (k === addDays(t, -1)) return 'Yesterday';
  if (k === addDays(t, 1)) return 'Tomorrow';
  return parseKey(k).toLocaleDateString('en-CA', { weekday: 'short', month: 'short', day: 'numeric' });

/* =====================================================================

const Nutrition = {
  scale(per100, grams) {
    const o = {};
    for (const k in per100) { const v = per100[k]; if (v != null && Number.isFinite(+v)) o[k] = +v * grams / 100; }
    return o;
  },
  sum(list) {
    const o = { kcal: 0, protein: 0, carbs: 0, fat: 0 };
    for (const n of list) for (const k in n) o[k] = (o[k] || 0) + (n[k] || 0);
    return o;
  },
  // A serving with id 'ml' stores the food's density (grams per ml). When it exists,
  // volume units (ml, fl oz, cup, tbsp, tsp) are offered alongside weight.
  units(servings) {
    const sv = servings || [];
    const d = sv.find(s => s.id === 'ml')?.grams;
    const out = sv.filter(s => s.id !== 'ml').map(s => ({ id: s.id, label: s.label, grams: s.grams, ml: s.ml }));
    out.push({ id: 'g', label: 'g', grams: 1, plain: true });
    if (d) out.push({ id: 'ml', label: 'ml', grams: d, plain: true });
    out.push({ id: 'oz', label: 'oz', grams: OZ, plain: true });
    if (d) {
      out.push({ id: 'floz', label: 'fl oz', grams: d * FLOZ, plain: true });
      const has = re => sv.some(s => s.id !== 'ml' && re.test(s.label));
      if (!has(/^cup$/)) out.push({ id: 'cup', label: 'cup', grams: 250 * d, ml: 250 });
      if (!has(/^tbsp$/)) out.push({ id: 'tbsp', label: 'tbsp', grams: 15 * d, ml: 15 });
      if (!has(/^tsp$/)) out.push({ id: 'tsp', label: 'tsp', grams: 5 * d, ml: 5 });
    }
    return out;
  },
  toGrams(qty, unitId, servings) {
    const u = Nutrition.units(servings).find(u => u.id === unitId) || { grams: 1 };
    return qty * u.grams;
  },
  roundFor(qty, unitId) {
    if (unitId === 'g') return qty < 10 ? Math.round(qty * 10) / 10 : Math.round(qty);
    if (unitId === 'oz') return Math.round(qty * 10) / 10;
    return Math.round(qty * 100) / 100;
  },
  macroKcal(n) { return (n.protein || 0) * 4 + (n.carbs || 0) * 4 + (n.fat || 0) * 9; },
};
const unitLabel = u => u.plain ? u.label : u.ml ? `${u.label} (${fmtG(u.ml)} ml)` : `${u.label} (${fmtG(u.grams)} g)`;
function unitText(qty, unitId, servings) {
  const q = fmtQty(qty);
  const u = Nutrition.units(servings).find(x => x.id === unitId);
  if (!u) return `${q} g`;
  if (u.plain) return `${q} ${u.label}`;
  return `${q} ${u.label} (${u.ml ? fmtG(qty * u.ml) + ' ml' : fmtG(qty * u.grams) + ' g'})`;
}

/* data/cnf — Canadian Nutrient File, Health Canada, 2015 (built in, offline) */
const CNF = (() => {
  try {
    const d = JSON.parse(document.getElementById('cnf-data').textContent);
    return d.f.map(([id, name, kcal, protein, carbs, fat, fiber, sugar, sodium, sv]) => {
      const per100 = { kcal, protein, carbs, fat };

      if (sodium != null) per100.sodium = sodium;
      // Short chip labels ("medium", not "medium (18cm to 20cm long)"); a medium portion is the default when one exists.
      const servings = (sv || []).map(([mi, g]) => ({ label: d.m[mi].replace(/\s*\([^)]*\)/g, '').trim() || d.m[mi], grams: g }))
        .filter((x, i, a) => a.findIndex(y => y.label === x.label) === i)
        .sort((a, b) => (b.label === 'medium') - (a.label === 'medium'))
        .map((x, i) => ({ id: 's' + (i + 1), ...x }));
      const vol = servings.find(x => x.label === 'cup') || servings.find(x => x.label === 'tbsp');

}
function load() {

}

function recipeTotals(r) {

const OFF = {
  base: 'https://world.openfoodfacts.org',
  fields: 'code,product_name,product_name_en,brands,nutriments,serving_size,serving_quantity,quantity',
  map(p) {
    const n = p.nutriments || {};
    let kcal = n['energy-kcal_100g'];
    if (kcal == null && n['energy_100g'] != null) kcal = n['energy_100g'] / 4.184;
    const name = String(p.product_name_en || p.product_name || '').trim();
    if (kcal == null || !name) return null;
    const per100 = { kcal: +kcal, protein: +(n.proteins_100g || 0), carbs: +(n.carbohydrates_100g || 0), fat: +(n.fat_100g || 0) };
    if (n.fiber_100g != null) per100.fiber = +n.fiber_100g;
    if (n.sugars_100g != null) per100.sugar = +n.sugars_100g;
    if (n.sodium_100g != null) per100.sodium = +n.sodium_100g * 1000;
    const servings = [];
    const sq = parseFloat(p.serving_quantity);
    const liquid = /\d\s*(ml|cl|l)\b/i.test(String(p.serving_size || '') + ' ' + String(p.quantity || ''));
    if (sq > 0) servings.push({ id: 's1', label: 'serving', grams: sq, ...(liquid ? { ml: sq } : {}) });
    if (liquid) servings.push({ id: 'ml', label: 'ml', grams: 1 });
    return { id: 'off:' + p.code, name, brand: String(p.brands || '').split(',')[0].trim(), source: 'off', per100, servings, barcode: String(p.code || '') };
  },
  async search(q) {
    const url = `${this.base}/cgi/search.pl?search_terms=${encodeURIComponent(q)}&search_simple=1&action=process&json=1&page_size=24&fields=${this.fields}`;
    const r = await fetch(url);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json();
    return (j.products || []).map(p => this.map(p)).filter(Boolean);
  },
  async barcode(code) {
    const r = await fetch(`${this.base}/api/v2/product/${encodeURIComponent(code)}.json?fields=${this.fields}`);
    if (r.status === 404) return null;
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json();
    if (j.status !== 1 || !j.product) return null;
    j.product.code = j.product.code || code;
    return this.map(j.product);
  },
};

const USDA = {
  base: 'https://api.nal.usda.gov/fdc/v1',

  async search(q) {

    if (r.status === 401 || r.status === 403) throw new Error('badkey');

const AI_SYS = `You turn a person's description of what they ate into a JSON list of foods with amounts.
Return only JSON in this shape: {"items":[{"text":"","food":"","search":"","amount":null,"unit":null,"unitLabel":""}]}
Rules:
- "text": the words from the description for this item.
- "food": a clear generic name. Keep preparation (cooked, raw, fried, toasted, roasted) and any brand that was stated.
- "search": 2 to 4 keywords to find it in a food database, most important first, such as "chicken breast roasted", "rice white cooked", "egg whole", "bread sourdough".
- "amount": the number stated, converting words to numbers ("half" = 0.5, "a couple" = 2). Use null if no amount was given.
- "unit": one of g, kg, oz, lb, ml, l, fl oz, cup, tbsp, tsp, piece, serving, or null.
- For countable things use "piece" and put the noun or size in "unitLabel", such as "slice", "large", "medium", "egg".
- Split combined items into separate foods. Ignore filler words.
- Never estimate calories or nutrients.`;
const AI_PHOTO_SYS = `You look at a photo of food someone is about to eat or just ate, and list each food you can see with an estimated amount, as JSON.
Return only JSON in this shape: {"items":[{"text":"","food":"","search":"","amount":null,"unit":null,"unitLabel":""}]}
Rules:
- "text": a short description of what you see, such as "grilled chicken breast, about a third of the plate".
- "food": a clear generic name with the likely preparation (grilled, fried, boiled, raw). Name a brand only if its packaging is readable.
- "search": 2 to 4 keywords to find it in a food database, most important first.
- Estimate "amount" in g for most foods, using typical portions and visual cues such as the plate (about 26 cm across), bowls, cups and cutlery.
- Use "piece" with a "unitLabel" for countable things (egg, slice, cookie, medium apple). Use "ml" for drinks.
- Include sauces, oils, dressings and toppings only if they are clearly visible.
- If the person adds notes, trust the notes over what you see.
- If there is no food in the photo, return {"items":[]}.
- Never estimate calories or nutrients.`;
const AI_LABEL_SYS = `You read a photo of a packaged food's Nutrition Facts table and copy the numbers exactly as printed, as JSON.
Return only JSON in this shape: {"name":"","brand":"","servingName":"","servingAmount":null,"servingUnit":"g","servingGrams":null,"kcal":null,"protein":null,"carbs":null,"fat":null,"fiber":null,"sugar":null,"sodium":null}
Rules:
- Copy the values for ONE serving exactly as printed in the "Per ..." or "Amount per serving" column. Never calculate or estimate. If the table shows per serving and per 100 g, use per serving.
- Canadian tables are bilingual (Fat / Lipides, Carbohydrate / Glucides, Fibre / Fibres, Sugars / Sucres, Protein / Protéines, Sodium). Ignore % Daily Value numbers.
- "servingName": the household measure in English, such as "cup", "slice", "bar", "2 biscuits". Use "serving" if there is none.
- "servingAmount" and "servingUnit": the metric amount of the serving, such as 250 and "ml" for "1 cup (250 mL)", or 30 and "g". If both grams and ml are printed, also put the grams in "servingGrams".
- "carbs" is total carbohydrate. "sodium" is in mg; if only salt in g is shown, sodium = salt × 400.
- "name" and "brand" only if readable in the photo, otherwise "".
- Use null for anything you cannot read clearly. If there is no nutrition table in the photo, return {"error":"no label"}.`;
function imageToJpeg(file, max = 1024) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const sc = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('image')); };
    img.src = url;
  });
}
const AI = {
  base: 'https://generativelanguage.googleapis.com/v1beta',
  fallback: ['gemini-3.6-flash', 'gemini-3.5-flash', 'gemini-3.1-flash-lite', 'gemini-flash-latest', 'gemini-2.5-flash'],
  key: () => String(db.settings.geminiKey || '').trim(),
  async err(r) { const e = new Error('HTTP ' + r.status); e.status = r.status; try { e.body = await r.text(); } catch (x) {} return e; },
  async listModels() {
    const r = await fetch(`${this.base}/models?pageSize=1000`, { headers: { 'x-goog-api-key': this.key() } });
    if (!r.ok) throw await this.err(r);
    const j = await r.json();
    const score = n => { const v = parseFloat((n.match(/gemini-(\d+(?:\.\d+)?)/) || [])[1] || 0); return v * 10 - (/lite/.test(n) ? 3 : 0) - (/preview|exp/.test(n) ? 1 : 0); };
    return (j.models || [])
      .filter(m => (m.supportedGenerationMethods || []).includes('generateContent'))
      .map(m => String(m.name).replace(/^models\//, ''))
      .filter(n => /flash/.test(n) && !/image|tts|audio|live|embed|robot|computer|native/.test(n))
      .sort((a, b) => score(b) - score(a));
  },
  async generate(model, sys, text) {
    const r = await fetch(`${this.base}/models/${encodeURIComponent(model)}:generateContent`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-goog-api-key': this.key() },
      body: JSON.stringify({ systemInstruction: { parts: [{ text: sys }] }, contents: [{ role: 'user', parts: typeof text === 'string' ? [{ text }] : text }],
        generationConfig: { temperature: 0, responseMimeType: 'application/json' } }),
    });
    if (!r.ok) throw await this.err(r);
    const j = await r.json();
    const out = (j.candidates?.[0]?.content?.parts || []).filter(p => !p.thought).map(p => p.text || '').join('');
    return JSON.parse(out.replace(/```json|```/g, '').trim());
  },
  // Tries the last model that worked, then whatever this key can see, then known names.
  async run(sys, text) {
    if (!this.key()) { const e = new Error('nokey'); e.status = 0; throw e; }
    let tried = new Set(), last = null, listed = false;
    let queue = [db.settings.geminiModel].filter(Boolean);
    while (true) {
      if (!queue.length && !listed) {
        listed = true;
        try { queue = await this.listModels(); } catch (e) { last = e; queue = []; }
        queue = [...queue, ...this.fallback];
      }
      const model = queue.shift();
      if (!model) throw last || new Error('nomodel');
      if (tried.has(model)) continue;
      tried.add(model);
      try {
        const json = await this.generate(model, sys, text);
        if (db.settings.geminiModel !== model) { db.settings.geminiModel = model; save(); }
        return { model, json };
      } catch (e) {
        if (e.status === 429) throw e;
        last = e;
        if (model === db.settings.geminiModel) { db.settings.geminiModel = ''; save(); }
      }
    }
  },
  async parse(text) {
    const { json } = await this.run(AI_SYS, text);
    return (Array.isArray(json?.items) ? json.items : []).slice(0, 15);
  },
  async readLabel(dataUrl) {
    const { json } = await this.run(AI_LABEL_SYS, [{ inlineData: { mimeType: 'image/jpeg', data: dataUrl.split(',')[1] } }, { text: 'Read this Nutrition Facts table.' }]);
    if (!json || json.error) { const e = new Error('nolabel'); throw e; }
    return json;
  },
  async parsePhoto(dataUrl, note) {
    const parts = [{ inlineData: { mimeType: 'image/jpeg', data: dataUrl.split(',')[1] } },
      { text: note ? `Notes from the person: ${note}` : 'List the foods in this photo.' }];
    const { json } = await this.run(AI_PHOTO_SYS, parts);
    return (Array.isArray(json?.items) ? json.items : []).slice(0, 15);
  },
  errorText(e) {
    if (e.message === 'image') return "Couldn't open that photo. Try another one.";
    if (e.message === 'nolabel') return "Couldn't find a Nutrition Facts table in that photo. Try again closer, flat and in good light.";
    if (e.message === 'nokey') return 'Add your Gemini key in Settings, under AI food entry.';
    if (e.status === 429) return "Gemini's free limit is used up for now. Try again later, or use search.";
    if (e.status === 401 || e.status === 403) return 'Gemini rejected the key. Check it in Settings and tap Test connection.';
    if (e instanceof SyntaxError) return "Gemini's reply didn't make sense. Try rewording, listing each food with its amount.";
    return "Couldn't reach Gemini. Check your connection and try again.";
  },
};

function dailyLogSummary() {

  const summaries = {};
  for (const [key, entries] of Object.entries(byDay)) {

function renderWeekStrip(day, summary) {

    const full = d.toLocaleDateString('en-CA', {weekday:'long',month:'long',day:'numeric',year:'numeric'});

// Mon–Sun, calculated for the selected date, using each day's target (including custom weekday targets).
// An unlogged day is unknown intake, not a confirmed zero; the remaining budget is provisional.
function weeklyCalorieSummary(selectedDate) {
  const start = parseKey(selectedDate);
  start.setDate(start.getDate() - (start.getDay() + 6) % 7);
  const dayKeys = Array.from({length: 7}, (_, i) => dateKey(new Date(start.getFullYear(), start.getMonth(), start.getDate() + i)));
  const target = dayKeys.reduce((s, key) => s + (Number(Repo.targetFor(key).kcal) || 0), 0);
  const byDate = Repo.logsByDate();
  const entries = dayKeys.flatMap(key => byDate[key] || []);
  const total = Nutrition.sum(entries.map(logNutrition));
  const loggedDays = dayKeys.filter(key => (byDate[key] || []).length > 0).length;
  const startLabel = parseKey(dayKeys[0]).toLocaleDateString('en-CA', {month:'short',day:'numeric'});
  const endLabel = parseKey(dayKeys[6]).toLocaleDateString('en-CA', {month:'short',day:'numeric'});
  return {target, total, loggedDays, start:dayKeys[0], end:dayKeys[6], label:`${startLabel} – ${endLabel}`};
}

        $('#copy-target-preview',root).textContent = `${foods.length || 'No'} ${foods.length === 1 ? 'food' : 'foods'} → ${dateText} · ${mealText}`;
      };
      root.addEventListener('change', e => {

        if (box) {
          if (box.checked) selected.add(box.dataset.id); else selected.delete(box.dataset.id);
        }
        if (box || e.target === destInput || e.target === mealInput) sync();
      });
      destInput.addEventListener('input', sync);
      const search = $('#copy-search', root);
      search?.addEventListener('input', () => {
        const q = search.value.trim().toLowerCase();
        let visible = 0;
        root.querySelectorAll('.copy-choice').forEach(row => {
          const show = row.textContent.toLowerCase().includes(q);
          row.hidden = !show;
          if (show) visible++;
        });
        root.querySelectorAll('.copy-meal-bar').forEach(bar => {
          let node = bar.nextElementSibling, any = false;
          while (node && !node.classList.contains('copy-meal-bar')) {
            if (!node.hidden) any = true;
            node = node.nextElementSibling;
          }
          bar.hidden = !any;
        });
        $('#copy-filter-empty',root).hidden = visible !== 0;
      });
      root.addEventListener('click', e => {
        const btn = e.target.closest('[data-s]'); if (!btn) return;
        const action = btn.dataset.s;
        if (action === 'copy-date') { destInput.value = btn.dataset.date; sync(); return; }
        if (action === 'copy-group') {
          const items = candidates.filter(l => l.meal === btn.dataset.meal);
          const check = !items.every(l => selected.has(l.id));
          items.forEach(l => { if (check) selected.add(l.id); else selected.delete(l.id); });
          boxes.forEach(box => { box.checked = selected.has(box.dataset.id); });
          sync(); return;
        }
        if (action === 'copy-all' || action === 'copy-none') {
          boxes.forEach(box => { box.checked = action === 'copy-all'; });
          selected.clear(); if (action === 'copy-all') candidates.forEach(l => selected.add(l.id));
          sync(); return;
        }
        if (action !== 'copy-submit') return;
        const dest = destInput.value;
        if (!/^\d{4}-\d{2}-\d{2}$/.test(dest) || dateKey(parseKey(dest)) !== dest) {
          toast('Choose a valid destination date'); return;
        }
        const meal = mealInput.value || null;
        const chosen = selection().filter(l => db.logs[l.id]);
        if (!chosen.length) { toast('Select at least one food'); return; }
        if (dest === srcDate && !confirm('Copy into the same date? These foods will be added again, not moved.')) return;
        const ids = copyLogsWithIds(chosen, dest, meal);
        if (!ids.length) return;
        ui.date = dest; closeSheet(); go('today');
        toast(`Copied ${ids.length} ${ids.length === 1 ? 'food' : 'foods'} to ${dayLabel(dest)}`, {
          label:'Undo', fn:() => { ids.forEach(id => delete db.logs[id]); save(); render(); }
        });
      });
      sync();
    });
}

/* ---------- swipe to delete ---------- */
let sw = null, suppressClick = false;
document.addEventListener('touchstart', e => {
  const m = e.target.closest('.entry-main'); if (!m) return;
  const t = e.touches[0]; sw = { m, x: t.clientX, y: t.clientY, dx: 0, lock: null };
}, { passive: true });
document.addEventListener('touchmove', e => {
  if (!sw) return;
  const t = e.touches[0], dx = t.clientX - sw.x, dy = t.clientY - sw.y;
  if (sw.lock === null) {
    if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
    sw.lock = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
    if (sw.lock === 'x') sw.m.classList.add('dragging');
  }
  if (sw.lock !== 'x') return;
  sw.dx = Math.min(0, dx);
  sw.m.style.transform = `translateX(${sw.dx}px)`;
}, { passive: true });
function endSwipe() {
  if (!sw) return;
  const { m, dx, lock } = sw; sw = null;
  m.classList.remove('dragging');
  if (lock === 'x') { suppressClick = true; setTimeout(() => suppressClick = false, 350); }
  if (dx < -Math.min(110, m.offsetWidth * 0.3)) {
    m.style.transform = 'translateX(-100%)';
    const id = m.dataset.id; setTimeout(() => deleteLogWithUndo(id), 180);
  } else m.style.transform = '';
}
document.addEventListener('touchend', endSwipe);
document.addEventListener('touchcancel', endSwipe);

function foodRow(food, { quick = true } = {}) {
  const p = defaultPortion(food);
  const grams = Nutrition.toGrams(p.qty, p.unitId, food.servings);
  const n = Nutrition.scale(food.per100, grams);
  const sub = [food.brand || SOURCE_LABEL[food.source] || '', unitText(p.qty, p.unitId, food.servings)].filter(Boolean).join(', ');
  return `<li class="frow">
    <button class="frow-main" data-action="pick-food" data-id="${esc(food.id)}">
      <span class="f-name">${esc(food.name)}</span><span class="f-kcal">${fmtN(n.kcal)}<small>kcal</small></span>
      <span class="f-sub">${esc(sub)}</span>
      <span class="f-mac">${MACROS.map(m => `<b style="color:${m.color}">${m.short}</b>${fmtN(n[m.key] || 0)}`).join(' ')}</span>
    </button>

  </li>`;
}
const PROCESSED = ['dried', 'powder', 'dehydrated', 'glutinous', 'imitation', 'substitute', 'babyfood', 'mix', 'canned', 'concentrate', 'condensed', 'evaporated', 'flour', 'freeze-dried', 'unprepared', 'baby'];
const processedHits = (name, q) => PROCESSED.filter(w => new RegExp(`\\b${w}\\b`).test(name) && !q.includes(w)).length;
function searchLocal(q) {
  const toks = q.toLowerCase().split(/\s+/).filter(Boolean);
  if (!toks.length) return [];
  return Repo.allFoods().map(f => {
    const hay = f._h || (f.name + ' ' + (f.brand || '')).toLowerCase();
    if (!toks.every(t => hay.includes(t))) return null;
    const u = db.usage[f.id];
    const first = f.name.toLowerCase().split(',')[0];
    const s = (u ? u.count * 5 : 0) + (db.favorites[f.id] ? 20 : 0) + (first.startsWith(toks[0]) ? 10 : 0) + (first === toks[0] ? 4 : 0) + (f.source === 'custom' || f.source === 'recipe' ? 8 : 0) - f.name.length / 20 - processedHits(hay, q.toLowerCase()) * 3;
    return { f, s };
  }).filter(Boolean).sort((a, b) => b.s - a.s || a.f.name.localeCompare(b.f.name)).map(x => x.f);
}

let usdaTimer;
const refreshFood = () => { if (ui.tab === 'food') renderFoodBody(); };
const onlineFor = q => { if (ui.online.q !== q) ui.online = { q, usda: null, off: null }; return ui.online; };
function scheduleUsda() {
  clearTimeout(usdaTimer);
  const q = ui.query.trim(); if (q.length < 3) return;
  usdaTimer = setTimeout(() => { if (ui.query.trim() === q) runUsda(q); }, 450);
}
async function runUsda(q) {
  const o = onlineFor(q);
  if (o.usda === 'loading' || Array.isArray(o.usda)) return;
  if (!USDA.key()) { o.usda = 'nokey'; refreshFood(); return; }
  o.usda = 'loading'; refreshFood();
  let result;
  try { result = await USDA.search(q); result.forEach(f => ui.offMap[f.id] = f); }
  catch (e) { result = e.message === 'badkey' ? 'badkey' : e.message === 'nokey' ? 'nokey' : 'error'; }
  if (ui.online.q === q) { ui.online.usda = result; refreshFood(); }
}
async function runOff(q) {
  const o = onlineFor(q);
  if (o.off === 'loading' || Array.isArray(o.off)) return;
  o.off = 'loading'; refreshFood();
  let result;
  try { result = await OFF.search(q); result.forEach(f => ui.offMap[f.id] = f); }
  catch (e) { result = 'error'; }
  if (ui.online.q === q) { ui.online.off = result; refreshFood(); }
}
function runOnlineSearch() {
  const q = ui.query.trim(); if (q.length < 2) return;
  pushHistory(q);
  const o = onlineFor(q);
  if (o.off === 'error') o.off = null;
  if (o.usda === 'error') o.usda = null;
  runUsda(q); runOff(q);
}
function afterAdd(l) {
  if (ui.tab === 'food') renderFoodBody(); else render();
  toast(`Added to ${mealLabel(l.meal)}`, { label: 'Undo', fn: () => { delete db.logs[l.id]; save(); if (ui.tab === 'today') render(); } });
}

function nutPanel(n, grams) {

    <div class="s-macs">${MACROS.map(m => `<div style="--c:${m.color}"><b>${fmtG(n[m.key] || 0)} g</b><span>${m.label}</span></div>`).join('')}</div>

}
function openFoodSheet(food, log = null) {
  const servings = log ? log.snap.servings : (food.servings || []);

  const name = log ? log.snap.name : food.name;
  const brand = log ? log.snap.brand : food.brand;
  const foodId = log ? log.foodId : food.id;
  const units = Nutrition.units(servings);
  const p = log ? { qty: log.qty, unitId: log.unitId } : defaultPortion(food);
  let qty = p.qty, unitId = units.some(u => u.id === p.unitId) ? p.unitId : 'g', meal = log ? log.meal : ui.meal;
  const unitChip = u => `<button type="button" class="chip" data-s="unit" data-u="${u.id}" aria-pressed="${u.id === unitId}">${esc(unitLabel(u))}</button>`;

  openSheet(`
    <h2 class="s-title">${esc(name)}</h2>${brand ? `<p class="s-sub">${esc(brand)}</p>` : ''}
    <div class="qty-wrap">

      <div class="chips" id="su" role="group" aria-label="Unit">${units.map(unitChip).join('')}</div>
    </div>
    <div id="sn"></div>
    <p class="s-label">Meal</p>
    <div class="chips" id="sm" role="group" aria-label="Meal">${mealChips(meal)}</div>
    <div class="s-actions">
      ${foodId ? `<button type="button" class="iconbtn fav" data-s="fav" aria-pressed="${!!db.favorites[foodId]}" aria-label="Favourite">${I.star}</button>` : ''}
      <button type="button" class="btn" data-s="save"></button>
    </div>
    ${log ? `<div class="s-sec"><button type="button" class="textbtn" data-s="dup">Duplicate</button><button type="button" class="textbtn danger" data-s="del">Delete</button></div>` : ''}
  `, root => {
    const upd = () => {
      const grams = Nutrition.toGrams(qty, unitId, servings);
      $('#sn', root).innerHTML = nutPanel(Nutrition.scale(per100, grams), grams);
      const b = $('[data-s=save]', root);
      b.textContent = log ? 'Save changes' : ui.batch.active ? 'Add to log' : `Add to ${mealLabel(meal)}`;
      b.disabled = !(qty > 0);
    };
    const qi = $('#sq', root);
    qi.addEventListener('input', () => { qty = parseNum(qi.value); upd(); });
    qi.addEventListener('focus', () => qi.select());
    qi.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); $('[data-s=save]', root).click(); } });
    root.addEventListener('click', e => {
      const t = e.target.closest('[data-s]'); if (!t) return;
      const s = t.dataset.s;
      if (s === 'unit') {
        const from = units.find(u => u.id === unitId), to = units.find(u => u.id === t.dataset.u);
        const g = qty * from.grams; unitId = to.id;
        qty = Nutrition.roundFor(g / to.grams, unitId);
        qi.value = fmtQty(qty); setPressed($('#su', root), 'u', unitId); upd();
      } else if (s === 'meal') { meal = t.dataset.m; setPressed($('#sm', root), 'm', meal); upd(); }
      else if (s === 'fav') { toggleFav(foodId); t.setAttribute('aria-pressed', !!db.favorites[foodId]); }

        if (!(qty > 0)) return;

          db.logs[log.id] = log; Repo.touchUsage(foodId, qty, unitId); save(); closeSheet(); render();

      } else if (s === 'dup') { copyLogs([log], log.date); closeSheet(); render(); toast('Duplicated'); }
      else if (s === 'del') { closeSheet(); deleteLogWithUndo(log.id); }
    });
    upd();
  });
}

function bindQuickForm(root, onSubmit) {

  `, root => { $('[data-f=su]', root).addEventListener('change', e => { $('#densf', root).hidden = e.target.value !== 'ml'; });
    $('#lblfile', root).addEventListener('change', async e => {

      st.textContent = 'Reading the label…'; btn.disabled = true;

      if (get('kcal') === '') { $('[data-f=kcal]', root).focus(); toast('Add calories per serving'); return; }
      const per100 = {};
      for (const k of ['kcal', 'protein', 'carbs', 'fat', ...EXTRA.map(x => x.key)]) {
        const raw = get(k); if (raw === '') { if (MACROS.some(m => m.key === k)) per100[k] = 0; continue; }

      }
      const f = {
        ...(food || {}), id: food?.id || 'c:' + uid(), name: nm, brand: get('brand'), source: food?.source || 'custom',
        per100, servings: (() => {
          const rest = (food?.servings || []).slice(1).filter(x => x.id !== 'ml');
          const oldMl = (food?.servings || []).find(x => x.id === 'ml');
          const first = { id: s0?.id || 's1', label: get('sname') || 'serving', grams, ...(su === 'ml' ? { ml: amount } : {}) };

      toast('Food deleted. Past logs keep their numbers.', { label: 'Undo', fn: () => { db.foods[snapshot.id] = snapshot; if (fav) db.favorites[snapshot.id] = fav; if (usage) db.usage[snapshot.id] = usage; save(); render(); } });
    }
  }); });
}

    const rows = list => list.map(f => `<li class="frow"><button type="button" class="frow-main" data-s="addi" data-id="${esc(f.id)}">

        r.items = r.items.filter(it => it.qty > 0);

        if (!(r.servings > 0)) { $('[data-r=servings]', root).focus(); toast('Enter how many servings it makes'); return; }

        delete db.recipes[r.id]; delete db.favorites[fid]; delete db.usage[fid]; save(); closeSheet(); render();

      }
    });
    drawItems(); drawSum();
    if (isNew) setTimeout(() => $('[data-r=name]', root)?.focus(), 320);
  });
}

/* ---------- barcode: lookup + camera scanning ---------- */
async function lookupBarcode(code) {

    openSheet(`<h2 class="s-title">No match for ${esc(code)}</h2>
      <p class="hint">Open Food Facts doesn't have this product. Create it from the label and the barcode is linked, so the next scan finds it instantly.</p>
      <div class="stack" style="margin-top:16px"><button class="btn block" data-s="label">Scan its nutrition label</button><button class="btn ghost block" data-s="create">Type it in instead</button><button class="btn ghost block" data-s="again">Scan again</button></div>`,
    root => root.addEventListener('click', e => {

let scanner = null, scanLib = null, scanSession = 0, torchOn = false;
const SCAN_URLS = [
  'https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js',
  'https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js',
  'https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js',
];
function loadScanner() {
  if (window.Html5Qrcode) return Promise.resolve();
  if (scanLib) return scanLib;
  scanLib = (async () => {
    for (const src of SCAN_URLS) {
      try {
        await new Promise((resolve,reject) => {
          const script = document.createElement('script'); script.src = src; script.async = true;
          const timer = setTimeout(() => { script.remove(); reject(new Error('timeout')); }, 11000);
          script.onload = () => { clearTimeout(timer); window.Html5Qrcode ? resolve() : reject(new Error('library missing')); };
          script.onerror = () => { clearTimeout(timer); script.remove(); reject(new Error('download failed')); };
          document.head.appendChild(script);
        });
        return;
      } catch (e) { /* try another CDN */ }

}
function scannerStatus(text) { const el = $('#scanst'); if (el) el.textContent = text; }
function scannerError(error) {

  if (/permission|notallowed|denied|security/.test(msg)) return 'Camera permission is blocked. Allow camera access in your browser settings, then tap Retry.';
  if (/notfound|devicesnotfound|no camera/.test(msg)) return 'No camera was found. You can scan a barcode photo or enter the number.';
  if (/notreadable|trackstart|in use|could not start/.test(msg)) return 'Camera is already in use by another app. Close the other camera and retry.';
  return `Could not start the camera. Try Retry or scan a photo instead. (${String(error?.message || error || 'unknown error').slice(0,110)})`;
}
async function stopScanner() {
  scanSession++; torchOn = false;
  const sc = scanner; scanner = null; if (!sc) return;
  try { if (sc.isScanning) await sc.stop(); } catch (e) {}
  try { sc.clear(); } catch (e) {}
}
function scannerTorchAvailable(sc) {
  try {
    const cap = sc.getRunningTrackCapabilities?.();
    if (cap && cap.torch === true) return true;
    const track = $('#reader video')?.srcObject?.getVideoTracks?.()[0];
    return track?.getCapabilities?.().torch === true;
  } catch (e) { return false; }
}
function updateTorchControl(sc) {
  const b = $('#scan-torch'); if (!b) return;
  const supported = scannerTorchAvailable(sc);
  b.disabled = !supported; b.setAttribute('aria-pressed', String(torchOn));
  b.innerHTML = `${I.flash}${supported ? (torchOn ? 'Flash off' : 'Flash on') : 'Flash unavailable'}`;
  b.title = supported ? 'Switch camera flashlight' : 'Camera torch not supported by this phone or browser';
}
async function toggleScannerTorch() {
  const sc = scanner; if (!sc || !sc.isScanning || !scannerTorchAvailable(sc)) return;
  const desired = !torchOn, button = $('#scan-torch'); if (button) button.disabled = true;
  try {
    if (typeof sc.applyVideoConstraints === 'function') {
      try { await sc.applyVideoConstraints({advanced:[{torch:desired}]}); }
      catch (primary) { const track = $('#reader video')?.srcObject?.getVideoTracks?.()[0]; if (!track) throw primary; await track.applyConstraints({advanced:[{torch:desired}]}); }
    } else {
      const track = $('#reader video')?.srcObject?.getVideoTracks?.()[0];

    }
    if (scanner !== sc) return;

  } catch (e) { scannerStatus('Your camera did not allow flashlight control. Scanning still works without it.'); }
  if (scanner === sc) updateTorchControl(sc);
}
async function scanBarcodePhoto(file) {
  if (!file) return;
  await stopScanner(); const token = scanSession;
  scannerStatus('Reading barcode from photo…');
  try {
    await loadScanner(); if (scanSession !== token || !$('#reader')) return;
    const sc = new window.Html5Qrcode('reader',{verbose:false}); scanner = sc;
    const result = await sc.scanFile(file,true);
    if (scanSession !== token) return;
    const code = String(result || '').replace(/\D/g,'');

    await stopScanner();
    closeSheet(); await lookupBarcode(code);
  } catch (e) {
    scannerStatus(e?.message === 'scanner-download' ? 'Could not download the scanner. Check your internet connection or type the barcode.' : 'No readable barcode found in that photo. Retake it in good light, or tap Retry camera.');

}
async function openScanner() {

/* ---------- AI food entry: match parsed items against the food databases ---------- */
function portionFor(f, p) {
  const amt = Number(p?.amount) > 0 ? Number(p.amount) : null;
  const unit = String(p?.unit || '').toLowerCase(), lbl = String(p?.unitLabel || '').toLowerCase().trim();
  const sv = f.servings || [];
  const find = re => sv.find(s => re.test(s.label.toLowerCase()));
  const cup = find(/^cup/), tbsp = find(/^tbsp|^tablespoon/), tsp = find(/^tsp|^teaspoon/);
  const us = Nutrition.units(sv), hasU = id => us.some(u => u.id === id);
  const byMl = ml => hasU('ml') ? { qty: Math.round(ml), unitId: 'ml' } : cup ? { qty: Nutrition.roundFor(ml / 250, cup.id), unitId: cup.id } : { qty: Math.round(ml), unitId: 'g' };
  if (!amt && !lbl && (!unit || unit === 'null')) return defaultPortion(f);
  const n = amt || 1;
  if (unit === 'g') return { qty: n, unitId: 'g' };
  if (unit === 'kg') return { qty: n * 1000, unitId: 'g' };
  if (unit === 'oz') return { qty: n, unitId: 'oz' };
  if (unit === 'lb') return { qty: Nutrition.roundFor(n * 16, 'oz'), unitId: 'oz' };
  if (unit === 'ml') return byMl(n);
  if (unit === 'l') return byMl(n * 1000);
  if (unit === 'fl oz' || unit === 'floz') return hasU('floz') ? { qty: n, unitId: 'floz' } : byMl(n * FLOZ);
  if (unit === 'cup') return cup ? { qty: n, unitId: cup.id } : hasU('cup') ? { qty: n, unitId: 'cup' } : byMl(n * 250);
  if (unit === 'tbsp') return tbsp ? { qty: n, unitId: tbsp.id } : hasU('tbsp') ? { qty: n, unitId: 'tbsp' } : byMl(n * 15);
  if (unit === 'tsp') return tsp ? { qty: n, unitId: tsp.id } : hasU('tsp') ? { qty: n, unitId: 'tsp' } : byMl(n * 5);
  const m = lbl && (sv.find(s => s.label.toLowerCase() === lbl) || sv.find(s => s.label.toLowerCase().includes(lbl) || lbl.includes(s.label.toLowerCase())));

}
// Re-rank for parsed items: fewer unexplained extra words, no processed forms unless asked,
// a serving that fits how it was described ("large" egg, a cup), and generic "all varieties" entries.
function rankAi(list, p, q) {
  const ql = (q + ' ' + (p.food || '')).toLowerCase();

  const unit = String(p.unit || '').toLowerCase(), lbl = String(p.unitLabel || '').toLowerCase();
  return list.map((f, i) => {
    const name = f.name.toLowerCase();
    const extra = name.split(/[^a-z0-9%]+/).filter(w => w && !qt.has(w) && !['and', 'or', 'with', 'of'].includes(w)).length;
    const sv = (f.servings || []).map(s => s.label.toLowerCase());
    const fits = (lbl && sv.some(l => l.includes(lbl) || lbl.includes(l))) || (unit === 'cup' && sv.some(l => l.startsWith('cup'))) || (unit === 'tbsp' && sv.some(l => l.startsWith('tbsp')));
    const cookedAsk = /\b(cooked|grilled|baked|roasted|fried|boiled|broiled|steamed|poached|pan|bbq|barbecued)\b/.test(ql);
    const prep = cookedAsk ? (/\braw\b/.test(name) && !/\braw\b/.test(ql) ? -5 : /\b(cooked|grilled|baked|roasted|broiled|dry heat|steamed|poached|boiled)\b/.test(name) ? 2 : 0) : 0;
    const score = -extra + prep - processedHits(name, ql) * 6 + (fits ? 5 : 0) + (/all (commercial )?varieties/.test(name) ? 3 : 0)
      + (db.usage[f.id] ? 6 + Math.min(db.usage[f.id].count, 10) : 0) + (f.source === 'custom' || f.source === 'recipe' ? 8 : 0) - i * 0.15;

}

function intakeAverages(byDate, days) {
  // Logged days only, ending yesterday — today is still in progress.
  let logged = 0; const tot = { kcal: 0, protein: 0, carbs: 0, fat: 0 };

    const ls = byDate[addDays(todayKey(), -i)]; if (!ls || !ls.length) continue;
    logged++; const n = Nutrition.sum(ls.map(logNutrition));
    for (const k in tot) tot[k] += n[k] || 0;

}

function trendHTML(byDate) {

    </svg><div class="trend-axis"><span>${esc(dayLabel(items[0].date))}</span><span>Today</span></div></div>
